[project]
name = "adb-challenge"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["N802", "N806"]  # math-style names (L1, Lam, G) are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
