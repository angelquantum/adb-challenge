[project]
name = "adb-challenge"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["N802", "N806"]  # math-style names (L1, Lam, G) are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# printed figure and report text uses typographic minus and multiplication signs on purpose
"quantum/new/figures.py" = ["RUF001"]
"quantum/new/report.py" = ["RUF001", "E501"]  # long lines are report prose
