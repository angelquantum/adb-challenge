[project]
name = "adb-challenge"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["N802", "N806"]  # math-style names (L1, Lam, G) are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# printed figure text uses typographic minus and multiplication signs on purpose
"benchmarks/figures.py" = ["RUF001"]
